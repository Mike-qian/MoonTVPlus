name: Sync Upstream (Force & Protect)

on:
  schedule:
    # 北京时间凌晨 00:00 对应 UTC 16:00
    - cron: '0 16 * * *'
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write 

    steps:
      - name: Checkout private repo
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_GIT_TOKEN }}

      - name: Sync Files and Force Merge
        env:
            GH_TOKEN: ${{ secrets.MY_GIT_TOKEN }}
        run: |
          # 1. 配置身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 2. 预先备份当前版本的工作流文件 (这是最稳妥的办法)
          cp .github/workflows/1.yml /tmp/1.yml.bak || echo "No existing 1.yml found"
          # 3. 增加上游并拉取
          git remote add upstream https://github.com/mtvpls/MoonTVPlus.git || true
          git fetch upstream main
          # 4. 强制重置到上游状态 (真正意义上的强制同步)
          # 注意：这会丢弃你本地除 1.yml 以外的所有其他修改
          git reset --hard upstream/main
          # 5. 还原被覆盖的 1.yml
          mkdir -p .github/workflows
          cp /tmp/1.yml.bak .github/workflows/1.yml
          # 6. 提交并强制推送
          git add .github/workflows/1.yml
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: sync upstream and restore local 1.yml"
            git push origin main --force
            
            # 触发部署工作流 (如果文件存在的话)
            gh workflow run cloudflare-deploy.yml --ref main || echo "Deployment workflow not found, skipping..."
          else
            # 如果 reset 后没有任何变化，说明已经同步且 1.yml 一致
            # 但为了保险，如果没有提交记录，强制推一次确保同步
            git push origin main --force
            echo "Already up to date, force pushed to ensure sync."
          fi
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 7
          keep_minimum_runs: 6
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
